<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ryowu Portal{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html { font-family: 'Roboto', 'Noto Sans TC', sans-serif; background-color: #f4f6f9; height: 100%; margin: 0; }
        .fullscreen-wrapper { display: flex; width: 100vw; height: 100vh; overflow: hidden; }
        #content-area { flex-grow: 1; height: 100vh; overflow-y: auto; background-color: #f4f6f9; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <div class="fullscreen-wrapper">
        <!-- 引用側邊欄組件 -->
        {% include "components/side_bar.html" %}

        <!-- 主要內容區塊 -->
        <div id="content-area" class="h-100 w-100 d-flex flex-column justify-content-center align-items-center">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Bootstrap 登出確認 Modal -->
    <div class="modal fade" id="logoutModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fa-solid fa-triangle-exclamation text-warning me-2"></i>系統提示</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    確定要登出系統嗎？
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" onclick="executeLogout()">確定登出</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 引用獨立的共用訊息提示 Modal 組件 -->
    {% include "components/messages.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 開啟 Bootstrap 登出確認 Modal
        function openLogoutModal() {
            const modalEl = document.getElementById('logoutModal');
            const logoutModalInstance = new bootstrap.Modal(modalEl);
            logoutModalInstance.show();
        }

        // 執行登出
        function executeLogout() {
            localStorage.removeItem("token");
            fetch("/api/auth/logout", { method: "POST" }).then(() => {
                window.location.href = "/login";
            });
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
