<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ryowu Portal{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html { font-family: 'Roboto', 'Noto Sans TC', sans-serif; background-color: #f4f6f9; height: 100%; margin: 0; }
        .fullscreen-wrapper { display: flex; width: 100vw; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 260px; height: 100vh; transition: all 0.3s ease; display: flex; flex-direction: column; z-index: 1050; }
        #sidebar.collapsed { width: 75px; }
        #sidebar.collapsed .nav-text, #sidebar.collapsed .sidebar-title-text { display: none; }
        #sidebar.collapsed .sidebar-header { justify-content: center !important; }
        #sidebar.collapsed .nav-link { text-align: center; padding: 12px 0; }
        #sidebar.collapsed .nav-link i { margin-right: 0 !important; font-size: 1.25rem; }
        
        #content-area { flex-grow: 1; height: 100vh; overflow-y: auto; background-color: #f4f6f9; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <div class="fullscreen-wrapper">
        <!-- 側邊欄 (Sidebar) -->
        <nav id="sidebar" class="bg-dark text-white shadow d-none">
            <div class="sidebar-header d-flex justify-content-between align-items-center p-3 border-bottom border-secondary">
                <span class="sidebar-title-text fw-bold"><i class="fa-solid fa-shield-halved me-2"></i>Ryowu Portal</span>
                <button type="button" id="sidebarCollapse" class="btn btn-dark btn-sm text-white border-0 p-1">
                    <i class="fa-solid fa-bars-staggered fa-lg"></i>
                </button>
            </div>
            <ul class="nav flex-column p-2 gap-2 flex-grow-1">
                <li class="nav-item">
                    <a href="/" class="nav-link text-white rounded py-2 px-3" title="首頁">
                        <i class="fa-solid fa-house me-2"></i><span class="nav-text">首頁</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/profile" class="nav-link text-white rounded py-2 px-3" title="個人資料修改">
                        <i class="fa-solid fa-user-gear me-2"></i><span class="nav-text">個人資料修改</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/change-password" class="nav-link text-white rounded py-2 px-3" title="密碼重設">
                        <i class="fa-solid fa-key me-2"></i><span class="nav-text">密碼重設</span>
                    </a>
                </li>
            </ul>
            <div class="p-3 border-top border-secondary">
                <button class="btn btn-outline-danger w-100 btn-sm text-start text-truncate" onclick="confirmLogout()" title="登出系統">
                    <i class="fa-solid fa-right-from-bracket me-2"></i><span class="nav-text">登出系統</span>
                </button>
            </div>
        </nav>

        <!-- 主要內容區塊：強制使用 h-100 讓未登入頁面也能撐滿高度並置中 -->
        <div id="content-area" class="h-100 w-100 d-flex flex-column justify-content-center align-items-center">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const sidebarCollapseBtn = document.getElementById('sidebarCollapse');
        if (sidebarCollapseBtn) {
            sidebarCollapseBtn.addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('collapsed');
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("token");
            const currentPath = window.location.pathname;
            const publicPaths = ["/login", "/register", "/forgot-password", "/reset-password"];

            if (!token && !publicPaths.includes(currentPath)) {
                window.location.href = "/login";
            } else if (token && !publicPaths.includes(currentPath)) {
                document.getElementById("sidebar").classList.remove("d-none");
            }
        });

        function confirmLogout() {
            if (confirm("確定要登出系統嗎？")) {
                localStorage.removeItem("token");
                fetch("/api/auth/logout", { method: "POST" }).then(() => {
                    window.location.href = "/login";
                });
            }
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
