{% extends "base.html" %}
{% block title %}忘記密碼{% endblock %}
{% block content %}
<div class="card shadow border-0 p-4 p-md-5 w-100" style="max-width: 450px;">
    <h3 class="text-center mb-4"><i class="fa-solid fa-key me-2"></i>忘記密碼</h3>
    <form id="forgotForm">
        <div class="mb-3">
            <label class="form-label">請輸入您的註冊信箱</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <button type="submit" class="btn btn-warning w-100 py-2 mb-3 text-white">發送重設密碼連結</button>
    </form>
    <div class="text-center mt-2">
        <a href="/login" class="text-decoration-none small fw-bold">返回登入</a>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const res = await fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: document.getElementById("email").value })
        });
        const data = await res.json();
        if (res.ok) {
            alert(`${data.message}\n請檢查終端機取得重設連結。`);
            window.location.href = "/login";
        } else {
            alert(data.detail || "請求失敗");
        }
    });
</script>
{% endblock %}
