{% extends "base.html" %}
{% block title %}重設密碼{% endblock %}
{% block content %}
<div class="card shadow border-0 p-4 p-md-5 w-100" style="max-width: 450px;">
    <h3 class="text-center mb-4"><i class="fa-solid fa-lock-open me-2"></i>重設新密碼</h3>
    <form id="resetForm">
        <div class="mb-4">
            <label class="form-label">新密碼 (至少 6 碼)</label>
            <input type="password" class="form-control" id="new_password" required>
        </div>
        <button type="submit" class="btn btn-success w-100 py-2">確認修改密碼</button>
    </form>
</div>
{% endblock %}
{% block extra_js %}
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const res = await fetch("/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                token: token,
                new_password: document.getElementById("new_password").value
            })
        });
        const data = await res.json();
        if (res.ok) {
            alert(`${data.message}\n請重新登入。`);
            window.location.href = "/login";
        } else {
            alert(data.detail || "重設失敗");
        }
    });
</script>
{% endblock %}
