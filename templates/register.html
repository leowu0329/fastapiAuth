{% extends "base.html" %}
{% block title %}註冊{% endblock %}
{% block content %}
{% import "components/password_input.html" as comp %}
<div class="card shadow border-0 p-4 p-md-5 w-100" style="max-width: 450px;">
    <h3 class="text-center mb-4"><i class="fa-solid fa-user-plus me-2"></i>會員註冊</h3>
    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label">電子郵件 (Email)</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">使用者名稱</label>
            <input type="text" class="form-control" id="username" required>
        </div>
        <!-- 引用密碼組件 -->
        {{ comp.render_password_input(id="password", label="密碼 (至少 6 碼)", placeholder="請輸入密碼") }}
        
        <button type="submit" class="btn btn-success w-100 py-2 mb-3">註冊並發送驗證信</button>
    </form>
    <div class="text-center text-muted small">
        已經有帳號了？ <a href="/login" class="text-decoration-none fw-bold">返回登入</a>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const emailInput = document.getElementById("email");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");

        try {
            const res = await fetch("/api/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: emailInput.value,
                    username: usernameInput.value,
                    password: passwordInput.value
                })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                // 註冊成功：使用 Bootstrap Modal (success) 呈現，點擊確定後跳轉
                showCustomAlert(`${data.message}\n請檢查終端機取得驗證連結！`, () => {
                    window.location.href = "/login";
                }, "success");
            } else {
                // 註冊失敗：使用 Bootstrap Modal (danger) 呈現錯誤
                showCustomAlert(data.detail || "註冊失敗", null, "danger");
            }
        } catch (error) {
            console.error("連線錯誤:", error);
            showCustomAlert("網路連線發生錯誤，請稍後再試", null, "danger");
        }
    });
</script>
{% endblock %}
