{% extends "base.html" %}
{% block title %}註冊{% endblock %}
{% block content %}
<div class="card shadow border-0 p-4 p-md-5 w-100" style="max-width: 450px;">
    <h3 class="text-center mb-4"><i class="fa-solid fa-user-plus me-2"></i>會員註冊</h3>
    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label">電子郵件 (Email)</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">使用者名稱</label>
            <input type="text" class="form-control" id="username" required>
        </div>
        <div class="mb-4">
            <label class="form-label">密碼 (至少 6 碼)</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-success w-100 py-2 mb-3">註冊並發送驗證信</button>
    </form>
    <div class="text-center text-muted small">
        已經有帳號了？ <a href="/login" class="text-decoration-none fw-bold">返回登入</a>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const res = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: document.getElementById("email").value,
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            })
        });
        const data = await res.json();
        if (res.ok) {
            alert(`${data.message}\n請檢查終端機取得驗證連結！`);
            window.location.href = "/login";
        } else {
            alert(data.detail || "註冊失敗");
        }
    });
</script>
{% endblock %}
