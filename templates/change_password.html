{% extends "base.html" %}
{% block title %}密碼重設{% endblock %}
{% block content %}
<div class="container-fluid h-100 d-flex flex-column justify-content-center align-items-center">
    <div class="card shadow border-0 p-4 p-md-5 w-100" style="max-width: 600px;">
        <h3 class="text-center mb-4"><i class="fa-solid fa-key me-2"></i>變更密碼</h3>
        <form id="passwordForm">
            <div class="mb-3">
                <label class="form-label">原密碼</label>
                <input type="password" class="form-control" id="current_password" required>
            </div>
            <div class="mb-3">
                <label class="form-label">新密碼 (至少 6 碼)</label>
                <input type="password" class="form-control" id="new_password" required>
            </div>
            <div class="mb-4">
                <label class="form-label">確認新密碼</label>
                <input type="password" class="form-control" id="confirm_password" required>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success py-2">確認修改密碼</button>
                <a href="/" class="btn btn-outline-secondary">返回首頁</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
    const token = localStorage.getItem("token");
    if (!token) { window.location.href = "/login"; }

    document.getElementById("passwordForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const current_password = document.getElementById("current_password").value;
        const new_password = document.getElementById("new_password").value;
        const confirm_password = document.getElementById("confirm_password").value;

        if (new_password !== confirm_password) {
            alert("新密碼與確認新密碼不相符！");
            return;
        }

        const res = await fetch("/api/auth/change-password", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
                current_password,
                new_password,
                confirm_password
            })
        });

        const data = await res.json();
        if (res.ok) {
            alert("密碼修改成功！請重新登入。");
            localStorage.removeItem("token");
            window.location.href = "/login";
        } else {
            alert(data.detail || "密碼修改失敗");
        }
    });
</script>
{% endblock %}
