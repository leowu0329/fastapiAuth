<!-- 側邊欄 (Sidebar) -->
<nav id="sidebar" class="bg-dark text-white shadow d-none">
    <div class="sidebar-header d-flex justify-content-between align-items-center p-3 border-bottom border-secondary">
        <span class="sidebar-title-text fw-bold"><i class="fa-solid fa-shield-halved me-2"></i>Ryowu Portal</span>
        <!-- 改用 onclick 直接呼叫全域切換函式 -->
        <button type="button" class="btn btn-dark btn-sm text-white border-0 p-1" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars-staggered fa-lg"></i>
        </button>
    </div>
    <ul class="nav flex-column p-2 gap-2 flex-grow-1">
        <li class="nav-item">
            <a href="/" class="nav-link text-white rounded py-2 px-3" title="首頁">
                <i class="fa-solid fa-house me-2"></i><span class="nav-text">首頁</span>
            </a>
        </li>
        <li class="nav-item">
            <a href="/profile" class="nav-link text-white rounded py-2 px-3" title="個人資料修改">
                <i class="fa-solid fa-user-gear me-2"></i><span class="nav-text">個人資料修改</span>
            </a>
        </li>
        <li class="nav-item">
            <a href="/change-password" class="nav-link text-white rounded py-2 px-3" title="密碼重設">
                <i class="fa-solid fa-key me-2"></i><span class="nav-text">密碼重設</span>
            </a>
        </li>
    </ul>
    <div class="p-3 border-top border-secondary">
        <button class="btn btn-outline-danger w-100 btn-sm text-start text-truncate" onclick="openLogoutModal()" title="登出系統">
            <i class="fa-solid fa-right-from-bracket me-2"></i><span class="nav-text">登出系統</span>
        </button>
    </div>
</nav>

<style>
    /* 側邊欄專屬樣式 */
    #sidebar { width: 260px; height: 100vh; transition: all 0.3s ease; display: flex; flex-direction: column; z-index: 1050; flex-shrink: 0; }
    #sidebar.collapsed { width: 75px; }
    #sidebar.collapsed .nav-text, #sidebar.collapsed .sidebar-title-text { display: none; }
    #sidebar.collapsed .sidebar-header { justify-content: center !important; }
    #sidebar.collapsed .nav-link { text-align: center; padding: 12px 0; }
    #sidebar.collapsed .nav-link i { margin-right: 0 !important; font-size: 1.25rem; }
</style>

<script>
    // 定義全域切換函式，點擊按鈕時直接觸發
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (sidebar) {
            sidebar.classList.toggle('collapsed');
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        // 檢查登入狀態與顯示側邊欄
        const token = localStorage.getItem("token");
        const currentPath = window.location.pathname;
        const publicPaths = ["/login", "/register", "/forgot-password", "/reset-password"];

        if (!token && !publicPaths.includes(currentPath)) {
            window.location.href = "/login";
        } else if (token && !publicPaths.includes(currentPath)) {
            const sidebar = document.getElementById("sidebar");
            if (sidebar) {
                sidebar.classList.remove("d-none");
            }
        }
    });
</script>
