{% macro render_password_input(id, label, placeholder="請輸入密碼", required=true) %}
<div class="mb-3">
    <label for="{{ id }}" class="form-label">{{ label }}</label>
    <div class="input-group">
        <input type="password" class="form-control" id="{{ id }}" placeholder="{{ placeholder }}" {% if required %}required{% endif %}>
        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('{{ id }}', this)">
            <i class="fa-solid fa-eye-slash" id="{{ id }}_icon"></i>
        </button>
    </div>
</div>

<script>
    // 確保切換函式只被定義一次
    if (typeof togglePassword === 'undefined') {
        function togglePassword(fieldId, btn) {
            const inputField = document.getElementById(fieldId);
            const icon = document.getElementById(fieldId + '_icon');
            
            if (inputField.type === "password") {
                inputField.type = "text";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            } else {
                inputField.type = "password";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            }
        }
    }
</script>
{% endmacro %}
